name: PR Quality Gate

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  id-token: write
  contents: read
  security-events: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0 #Shallow Clones should be disabled for a better relevancy of analysis

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ">=1.25.11"

      - name: Setup GO environment
        run: |
          go mod download

      - name: Lint and run unit tests
        run: |
          make test
          go tool cover -func coverage.out

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6.1.0
        with:
          role-to-assume: ${{ secrets.LIQUIBASE_VAULT_OIDC_ROLE_ARN }}
          aws-region: us-east-1

      - name: Get secrets from vault
        id: vault-secrets
        uses: aws-actions/aws-secretsmanager-get-secrets@2cb1a461cbd4865ac4299648312e4704c646cd53 # v3.0.1
        with:
          secret-ids: |
            ,/vault/liquibase
          parse-json-secrets: true

      # TECHOPS-911: SonarSource/sonarcloud-github-action is deprecated and forwards to
      # sonarsource/sonarqube-scan-action@v5.0.0 by tag, which the enterprise "require
      # SHA-pinned actions" policy blocks. Use the maintained scanner pinned to a full
      # SHA (its only nested action, actions/cache, is SHA-pinned in this release, so it
      # is policy-compliant). SONAR_HOST_URL targets SonarQube Cloud (formerly SonarCloud).
      - name: SonarQube Cloud Scan
        uses: sonarsource/sonarqube-scan-action@2f77a1ec69fb1d595b06f35ab27e97605bdef703 # v5.3.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Needed to get PR information, if any
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

      - name: Build
        run: make build

  govulncheck:
    uses: ./.github/workflows/govulncheck.yml
    permissions:
      contents: read
      security-events: write
