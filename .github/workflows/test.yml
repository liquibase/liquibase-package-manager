name: PR Quality Gate

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  id-token: write
  contents: read
  security-events: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0 #Shallow Clones should be disabled for a better relevancy of analysis

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26.x"
          check-latest: true

      - name: Setup GO environment
        run: |
          go mod download

      - name: Lint and run unit tests
        run: |
          make test
          go tool cover -func coverage.out

      - name: Get the SonarCloud token from vault
        uses: liquibase/build-logic/.github/actions/setup-aws-vault@2003fece51886ec69cda3df1cb4520b3ceeb2e0c # main
        with:
          group: sonar
          role-arn: ${{ secrets.VAULT_GROUPED_SONAR_ROLE_ARN }}

      # TECHOPS-911: SonarSource/sonarcloud-github-action is deprecated and forwards to
      # sonarsource/sonarqube-scan-action@v5.0.0 by tag, which the enterprise "require
      # SHA-pinned actions" policy blocks. Use the maintained scanner pinned to a full
      # SHA (its only nested action, actions/cache, is SHA-pinned in this release, so it
      # is policy-compliant). SONAR_HOST_URL targets SonarQube Cloud (formerly SonarCloud).
      - name: SonarQube Cloud Scan
        uses: sonarsource/sonarqube-scan-action@2f77a1ec69fb1d595b06f35ab27e97605bdef703 # v5.3.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Needed to get PR information, if any
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

      - name: Build
        run: make build

  govulncheck:
    uses: ./.github/workflows/govulncheck.yml
    permissions:
      contents: read
      security-events: write
