name: Build and Attach Artifacts

permissions:
  contents: write
  id-token: write

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "LPM version to release (leave empty to auto-detect from latest draft)"
        required: false
        type: string
      release-id:
        description: "Release ID (leave empty to use latest draft)"
        required: false
        type: string

jobs:
  prepare-release:
    name: Prepare Release
    runs-on: ubuntu-latest
    # Waits for a reviewer; every other job needs this one, so one approval covers the release. [TECHOPS-1714]
    environment: release
    outputs:
      upload_url: ${{ steps.get-release.outputs.upload_url }}
      release_id: ${{ steps.get-release.outputs.release_id }}
      version: ${{ steps.determine-version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Event and input values come in through env, never ${{ }} inside run. [TECHOPS-1714]
      - name: Determine version
        id: determine-version
        env:
          EVENT_NAME: ${{ github.event_name }}
          TAG_NAME: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          # For automatic triggers (release published), extract from tag
          if [ "$EVENT_NAME" = "release" ]; then
            VERSION="${TAG_NAME#v}"
            echo "Using version from release tag: $VERSION"
          # For manual triggers, use input or VERSION file
          elif [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
            echo "Using input version: $VERSION"
          else
            VERSION=$(tr -d '\n ' < VERSION)
            echo "Using VERSION file: $VERSION"
          fi
          # VERSION feeds GITHUB_ENV, make and file names, so only accept a plain version.
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Error: '$VERSION' is not a valid version (expected X.Y.Z)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Get release information
        id: get-release
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_RELEASE_ID: ${{ github.event.release.id }}
          EVENT_UPLOAD_URL: ${{ github.event.release.upload_url }}
          INPUT_RELEASE_ID: ${{ inputs.release-id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          # For automatic triggers (release published), use event data
          if [ "$EVENT_NAME" = "release" ]; then
            RELEASE_ID="$EVENT_RELEASE_ID"
            UPLOAD_URL="$EVENT_UPLOAD_URL"
            echo "Using release from event: $RELEASE_ID"
          # For manual triggers, use provided release ID or get latest draft
          elif [ -n "$INPUT_RELEASE_ID" ]; then
            RELEASE_ID="$INPUT_RELEASE_ID"
            echo "Using provided release ID: $RELEASE_ID"
          else
            RELEASE_ID=$(curl -s -H "Authorization: token $GH_TOKEN" \
              "https://api.github.com/repos/$REPO/releases" | \
              jq -r '[.[] | select(.draft == true)][0].id')
            echo "Found latest draft release ID: $RELEASE_ID"
          fi

          if [ "$RELEASE_ID" = "null" ] || [ -z "$RELEASE_ID" ]; then
            echo "Error: No draft release found"
            exit 1
          fi
          # The ID goes into API URLs and GITHUB_ENV, so it must be numeric.
          if ! [[ "$RELEASE_ID" =~ ^[0-9]+$ ]]; then
            echo "Error: release ID '$RELEASE_ID' is not numeric"
            exit 1
          fi

          if [ "$EVENT_NAME" != "release" ]; then
            UPLOAD_URL=$(curl -s -H "Authorization: token $GH_TOKEN" \
              "https://api.github.com/repos/$REPO/releases/$RELEASE_ID" | \
              jq -r '.upload_url')
          fi

          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"
          echo "upload_url=$UPLOAD_URL" >> "$GITHUB_OUTPUT"
          echo "RELEASE_ID=$RELEASE_ID" >> "$GITHUB_ENV"

      - name: Check existing artifacts
        env:
          RELEASE_ID: ${{ steps.get-release.outputs.release_id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          echo "Checking for existing artifacts in release $RELEASE_ID..."

          ARTIFACTS=$(curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/$REPO/releases/$RELEASE_ID/assets" | \
            jq -r '.[].name')

          if [ -n "$ARTIFACTS" ]; then
            echo "⚠️  Release already has artifacts:"
            echo "$ARTIFACTS"
            echo ""
            echo "Note: New artifacts will be added alongside existing ones."
          else
            echo "✅ No existing artifacts found - clean slate"
          fi

  build-and-upload:
    name: Build ${{ matrix.arch.zip_name }}
    runs-on: ubuntu-latest
    needs: prepare-release
    strategy:
      matrix:
        arch:
          [
            { folder: darwin_amd64, zip_name: darwin },
            { folder: darwin_arm64, zip_name: darwin-arm64 },
            { folder: linux_amd64, zip_name: linux },
            { folder: linux_arm64, zip_name: linux-arm64 },
            { folder: s390x, zip_name: s390x },
            { folder: windows, zip_name: windows },
          ]

    env:
      VERSION: ${{ needs.prepare-release.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # `>=1.25.13` resolved to whichever Go was newest at build time, which is how
      # v0.3.6 shipped on go1.26.5 and put CVE-2026-39821 in every Liquibase container
      # image; `1.26.x` tracks the latest patch of one supported minor. [TECHOPS-1244]
      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26.x"
          check-latest: true
          cache: true

      - name: Update VERSION file
        run: echo "$VERSION" > VERSION

      - name: Build artifact for ${{ matrix.arch.zip_name }}
        run: |
          case "${{ matrix.arch.folder }}" in
            darwin_amd64)
              make darwin_amd64
              ;;
            darwin_arm64)
              make darwin_arm64
              ;;
            linux_amd64)
              make linux_amd64
              ;;
            linux_arm64)
              make linux_arm64
              ;;
            s390x)
              make s390x
              ;;
            windows)
              make windows
              ;;
          esac

      - name: Calculate SHA256 checksum
        id: checksum
        run: |
          ARTIFACT_PATH="bin/${{ matrix.arch.folder }}/lpm-${VERSION}-${{ matrix.arch.zip_name }}.zip"
          SHA256=$(sha256sum "$ARTIFACT_PATH" | awk '{print $1}')
          echo "sha256=$SHA256" >> $GITHUB_OUTPUT
          echo "artifact_path=$ARTIFACT_PATH" >> $GITHUB_OUTPUT
          echo "SHA256 for ${{ matrix.arch.zip_name }}: $SHA256"

      - name: Upload artifact to release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: v${{ env.VERSION }}
          files: ${{ steps.checksum.outputs.artifact_path }}

      - name: Save checksum to artifact
        run: |
          mkdir -p checksums
          echo "${{ steps.checksum.outputs.sha256 }}  lpm-${VERSION}-${{ matrix.arch.zip_name }}.zip" > checksums/${{ matrix.arch.zip_name }}.txt

      - name: Upload checksum artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: checksum-${{ matrix.arch.zip_name }}
          path: checksums/${{ matrix.arch.zip_name }}.txt
          retention-days: 1

      - name: Add to job summary
        run: |
          echo "### ✅ ${{ matrix.arch.zip_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Artifact:** lpm-${VERSION}-${{ matrix.arch.zip_name }}.zip" >> $GITHUB_STEP_SUMMARY
          echo "- **SHA256:** \`${{ steps.checksum.outputs.sha256 }}\`" >> $GITHUB_STEP_SUMMARY

  generate-checksums-file:
    name: Generate Checksums File
    runs-on: ubuntu-latest
    needs: [prepare-release, build-and-upload]
    env:
      VERSION: ${{ needs.prepare-release.outputs.version }}

    steps:
      - name: Download all checksum artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: checksum-*
          path: checksums

      - name: Combine checksums into single file
        run: |
          cd checksums
          cat checksum-*/*.txt | sort > ../checksums.txt
          cd ..
          echo "=== Combined Checksums ==="
          cat checksums.txt

      - name: Upload checksums file to release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: v${{ env.VERSION }}
          files: checksums.txt

      - name: Summary
        run: |
          echo "## 🎉 Release Artifacts Built and Uploaded" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** v${VERSION}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### SHA256 Checksums" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          cat checksums.txt >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ All artifacts built and attached to the published release!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Release:** https://github.com/${{ github.repository }}/releases/tag/v${VERSION}" >> $GITHUB_STEP_SUMMARY

  sync-version:
    name: Sync VERSION File
    runs-on: ubuntu-latest
    # Runs after the builds, so a failed build doesn't leave VERSION ahead of a release with no assets.
    # A manual dispatch has no release to sync.
    needs: [prepare-release, generate-checksums-file]
    if: github.event_name == 'release'

    steps:

      - name: Configure AWS credentials for vault access
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6.2.0
        with:
          role-to-assume: ${{ secrets.LIQUIBASE_VAULT_OIDC_ROLE_ARN }}
          aws-region: us-east-1

      - name: Get secrets from vault
        id: vault-secrets
        uses: aws-actions/aws-secretsmanager-get-secrets@2297f9a879480a9e3af9b293ed15c70caf8e1c88 # v3.0.2
        with:
          secret-ids: |
            ,/vault/liquibase
          parse-json-secrets: true

      - name: Get GitHub App token
        id: get-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ env.LIQUIBASE_GITHUB_APP_ID }}
          private-key: ${{ env.LIQUIBASE_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: write

      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.get-token.outputs.token }}

      - name: Extract version from release tag
        id: get-version
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${TAG_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Extracted version: $VERSION from tag: $TAG_NAME"

      # Checks both files, so a re-run repairs a partial sync; real commit or push errors fail the job.
      - name: Sync VERSION files
        id: update-version
        env:
          NEW_VERSION: ${{ steps.get-version.outputs.version }}
        run: |
          set -euo pipefail
          echo "$NEW_VERSION" > VERSION
          cp VERSION internal/app/VERSION

          if git diff --quiet -- VERSION internal/app/VERSION; then
            echo "updated=false" >> "$GITHUB_OUTPUT"
            echo "✅ VERSION files already match release: $NEW_VERSION"
            exit 0
          fi

          git config --local user.email "64099989+liquibot@users.noreply.github.com"
          git config --local user.name "liquibot"
          git add VERSION internal/app/VERSION
          git commit -m "Sync VERSION to $NEW_VERSION after release [skip ci]"
          git push origin main
          echo "updated=true" >> "$GITHUB_OUTPUT"
          echo "✅ VERSION files synced to $NEW_VERSION"

      - name: Summary
        env:
          RELEASE_NAME: ${{ github.event.release.name }}
          TAG_NAME: ${{ github.event.release.tag_name }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          VERSION: ${{ steps.get-version.outputs.version }}
          UPDATED: ${{ steps.update-version.outputs.updated }}
        run: |
          {
            echo "## Release Published - VERSION Sync"
            echo ""
            echo "**Release:** $RELEASE_NAME"
            echo "**Tag:** $TAG_NAME"
            echo "**Version:** $VERSION"
            echo ""
            if [ "$UPDATED" = "true" ]; then
              echo "✅ VERSION files updated and committed to main"
            else
              echo "✅ VERSION files already in sync"
            fi
            echo ""
            echo "**Release URL:** $RELEASE_URL"
          } >> "$GITHUB_STEP_SUMMARY"
